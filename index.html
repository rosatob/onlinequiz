<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <!-- Loading / Identity Screen -->
    <section id="identityScreen" class="screen">

      <h1>Quiz</h1>

      <div id="connectionMessage" class="message"></div>

      <form id="identityForm">

        <div class="form-group">
          <label for="studentName">Name</label>
          <input
            type="text"
            id="studentName"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="birthday">Birthday</label>
          <input
            type="text"
            id="birthday"
            inputmode="numeric"
            maxlength="2"
            pattern="[0-9]{1,2}"
            required
          >
        </div>

        <button type="submit" class="primary-button">
          Start Quiz
        </button>

      </form>

    </section>


    <!-- Quiz Screen -->
    <section id="quizScreen" class="screen hidden">

      <header class="quiz-header">
        <h1 id="quizTitle"></h1>
        <p id="quizDescription"></p>
      </header>

      <div id="quizMessage" class="message"></div>

      <form id="quizForm">

        <div id="questionsContainer"></div>

        <button
          type="submit"
          id="submitButton"
          class="primary-button submit-button"
        >
          Submit Answers
        </button>

      </form>

    </section>


    <!-- Already Completed Screen -->
    <section id="completedScreen" class="screen hidden">

      <p class="completed-message">
        You already completed this assignment. You are not able to change your answers
      </p>

    </section>


    <!-- Thank You Screen -->
    <section id="thankYouScreen" class="screen hidden">

      <p class="thank-you-message">
        Thank you for completing this assignment
      </p>

    </section>


    <!-- Error Screen -->
    <section id="errorScreen" class="screen hidden">

      <p id="errorMessage" class="error-message"></p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
