<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz Editor</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js" defer></script>
</head>

<body>

  <main class="editor-container">

    <section id="sign-in-gate" class="sign-in-gate">
      <h1>Teacher Portal</h1>
      <p>Sign in with your SFUSD Google account to manage quizzes.</p>
      <div id="google-sign-in-button"></div>
      <p id="auth-message" class="auth-message" role="status"></p>
    </section>

    <div id="editor-content" hidden>
      <header class="teacher-header">
        <h1>Quiz Editor</h1>
        <nav aria-label="Teacher tools">
          <a class="active" href="index.html">Quiz Editor</a>
        </nav>
        <div class="account-controls">
          <span id="signed-in-email"></span>
          <button type="button" id="sign-out">Sign out</button>
        </div>
      </header>

    <section class="panel quiz-setup-panel" aria-label="Quiz setup">
      <div class="quiz-setup-column quiz-create-column">
        <div class="quiz-setup-heading">
          <h2>New Quiz</h2>
          <button type="button" id="new-quiz">Start New Quiz</button>
        </div>
        <label>
          Quiz Title
          <input type="text" id="quiz-title" placeholder="Enter quiz title">
        </label>
        <label>
          Description
          <textarea id="quiz-description" placeholder="Enter a description" rows="3"></textarea>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="allow-editing">
          Allow students to edit their answers after submitting
        </label>
      </div>
      <div class="quiz-setup-column quiz-load-column">
        <h2>Load Quiz</h2>
        <label for="quiz-id">Choose a saved quiz</label>
        <select id="quiz-id" aria-describedby="quiz-list-status">
          <option value="">Select a quiz</option>
        </select>
        <span id="quiz-list-status" class="field-status" role="status"></span>
        <button type="button" id="load-quiz" class="primary-button">Load Quiz</button>
      </div>
    </section>


    <!-- QUESTIONS -->
    <section class="panel">

      <div class="section-header">

        <h2>Questions</h2>


      </div>

      <div id="questions-container"></div>

      <div class="add-question-footer">
        <button
          type="button"
          id="add-question"
          class="primary-button"
        >
          + Add Question
        </button>
      </div>

    </section>


    <!-- SAVE -->
    <div class="save-area">

      <button
        type="button"
        id="save-quiz"
        class="save-button"
      >
        Save Quiz
      </button>

      <div id="save-message" class="save-message"></div>

      <div id="quiz-link-area" class="quiz-link-area" style="display: none;">
        <label for="quiz-link">Student Quiz URL</label>
        <div class="quiz-link-row">
          <input type="text" id="quiz-link" readonly>
          <button type="button" id="copy-quiz-link">
            Copy Link
          </button>
        </div>
      </div>

    </div>
    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
