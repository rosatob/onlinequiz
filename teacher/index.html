<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz Editor</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js" defer></script>
</head>

<body>

  <main class="editor-container">

    <section id="sign-in-gate" class="sign-in-gate">
      <h1>Teacher Portal</h1>
      <p>Sign in with your SFUSD Google account to manage quizzes.</p>
      <div id="google-sign-in-button"></div>
      <p id="auth-message" class="auth-message" role="status"></p>
    </section>

    <div id="editor-content" hidden>
      <header class="teacher-header">
        <h1>Quiz Editor</h1>
        <nav aria-label="Teacher tools">
          <a class="active" href="index.html">Quiz Editor Home Page</a>
        </nav>
        <div class="account-controls">
          <span id="signed-in-email"></span>
          <button type="button" id="sign-out">Sign out</button>
        </div>
      </header>
    <section id="quiz-start-screen" class="panel">
      <div class="quiz-chooser">
        <div class="quiz-chooser-column">
          <h2>Load a Quiz</h2>
          
          <select id="quiz-id" disabled>
            <option value="">Select an existing quiz</option>
          </select>
          <button type="button" id="load-quiz" class="load-quiz-button" disabled>Retrieving Quizzes</button>
        </div>

        <div class="divider-column" aria-hidden="true"></div>

        <div class="quiz-chooser-column">
          <h2>Create a Quiz</h2>
          <label for="new-quiz-title">Quiz Title</label>
          <input type="text" id="new-quiz-title" placeholder="Enter quiz title">
          <label for="new-quiz-description">Description</label>
          <textarea id="new-quiz-description" placeholder="Enter a description" rows="2"></textarea>
          <label class="checkbox-label" for="new-allow-editing">
            <input type="checkbox" id="new-allow-editing">
            Allow students to edit their answers after submitting
          </label>
          <button type="button" id="start-editing" class="primary-button">Start Editing</button>
        </div>
      </div>
    </section>

    <div id="quiz-editor" hidden>
      <section class="panel quiz-info-panel">
        <h2>Quiz Details</h2>
        <label for="quiz-title">Quiz Title</label>
        <input type="text" id="quiz-title" placeholder="Enter quiz title">
        <label for="quiz-description">Description</label>
        <textarea id="quiz-description" placeholder="Enter a description" rows="2"></textarea>
        <label class="checkbox-label" for="allow-editing">
          <input type="checkbox" id="allow-editing">
          Allow students to edit their answers after submitting
        </label>
      </section>

      <!-- QUESTIONS -->
    <section class="panel">

      <div class="section-header">

        <h2>Questions</h2>


      </div>

      <div id="questions-container"></div>

      <div class="add-question-footer">
        <button
          type="button"
          id="add-question"
          class="primary-button"
        >
          + Add Question
        </button>
      </div>

    </section>


    <!-- SAVE -->
    <div class="save-area">

      <button type="button" id="save-quiz" class="save-button">
        Save Quiz
      </button>
      <div id="quiz-link-area" class="quiz-link-area" style="display: none;">
        <div class="quiz-link-row">
          <input type="text" id="quiz-link" aria-label="Student quiz link" readonly>
          <button type="button" id="copy-quiz-link">
            Copy Student Quiz Link
          </button>
        </div>
      </div>

    </div>
    </div>
    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
